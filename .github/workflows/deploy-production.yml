name: Protected production deployment

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact tested commit SHA to deploy
        required: true
        type: string
      backup_reference:
        description: Verified D1 export/checksum reference
        required: true
        type: string
      approval_phrase:
        description: Type DEPLOY AXIOM REVENUE ENGINE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: axiom-revenue-engine-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.approval_phrase == 'DEPLOY AXIOM REVENUE ENGINE'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      BETTER_AUTH_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check:safety
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:cloudflare
      - run: npx wrangler deploy --dry-run --autoconfig false

      - name: Record release inputs
        run: |
          echo "Release SHA: ${{ inputs.release_sha }}"
          echo "Backup reference: ${{ inputs.backup_reference }}"

      - name: Deploy approved build
        run: npm run deploy:production
