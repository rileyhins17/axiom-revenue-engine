# Outside watchdog: if the live app goes down it cannot email anyone itself,
# so GitHub checks it every 30 minutes and opens an issue (GitHub emails the repo
# owner, and the issue mentions Aidan). The issue closes itself when the site is back.
#
# Cloudflare's Bot Fight Mode challenges GitHub's servers on operations.getaxiom.ca
# (HTTP 403 with "cf-mitigated: challenge"), so the app itself is checked on its
# workers.dev address, which Bot Fight Mode does not cover. The custom domain counts
# as up when Cloudflare answers it, including with that challenge; it is down only on
# a timeout, a connection error or a server error.
name: Live site watchdog
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the Revenue Engine and its domain
        id: probe
        run: |
          app_ok=false
          domain_ok=false
          for i in 1 2 3; do
            app=$(curl -sS --max-time 20 -o app.json -w '%{http_code}' https://axiom-ops-omniscient.aidan-magee2.workers.dev/api/health) || true
            if [ "$app" = "200" ] && grep -q '"ok":true' app.json; then app_ok=true; fi
            domain=$(curl -sS --max-time 20 -o /dev/null -D domain.headers -w '%{http_code}' https://operations.getaxiom.ca/api/health) || true
            if [ "$domain" = "200" ]; then domain_ok=true; fi
            if [ "$domain" = "403" ] && grep -qi '^cf-mitigated: *challenge' domain.headers; then domain_ok=true; fi
            echo "attempt $i: app health HTTP $app, domain HTTP $domain" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$app_ok" = "true" ] && [ "$domain_ok" = "true" ]; then break; fi
            sleep 20
          done
          if [ "$app_ok" = "true" ] && [ "$domain_ok" = "true" ]; then ok=true; else ok=false; fi
          echo "app_ok=$app_ok domain_ok=$domain_ok" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - name: Open or close the site-down issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SITE_OK: ${{ steps.probe.outputs.ok }}
        run: |
          open=$(gh issue list --label site-down --state open --json number --jq '.[0].number')
          if [ "$SITE_OK" = "true" ]; then
            if [ -n "$open" ]; then gh issue close "$open" --comment "The site is back up. Nothing else to do."; fi
            exit 0
          fi
          if [ -z "$open" ]; then
            gh label create site-down --color B60205 --force >/dev/null
            printf '%s\n' \
              "The live Revenue Engine did not answer its health check 3 times in a row ($(date -u +%Y-%m-%dT%H:%MZ))." \
              "" \
              "**What this means:** the app may not load and calls may not sync right now." \
              "" \
              "**What to do:** Cloudflare usually recovers on its own within minutes. If this is still open in an hour, ask Claude to check the Cloudflare Worker and roll back the last release." \
              "" \
              "@Mageester @rileyhins17 - this issue closes itself when the site is back." > body.md
            gh issue create --label site-down --title "operations.getaxiom.ca is down" --body-file body.md
          fi
