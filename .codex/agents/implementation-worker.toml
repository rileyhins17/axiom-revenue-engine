name = "implementation_worker"
description = "Luna implementation worker for one explicit non-overlapping patch with an exclusive file allowlist."
model = "gpt-5.6-luna"
model_reasoning_effort = "max"
model_verbosity = "low"
sandbox_mode = "workspace-write"

developer_instructions = """
